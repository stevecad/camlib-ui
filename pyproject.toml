[build-system]
requires = ["setuptools>=78", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "camlib-ui"
version = "0.1.0"
description = "A demonstration interface for camlib, the CAM engine: write a program, build it, check it, play it back (demo only)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# camlib itself is installed from its repository (pip install <camlib checkout>): see README.md.
dependencies = [
    "cadquery>=2.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]


[project.urls]
Repository = "https://github.com/stevecad/camlib-ui"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
camlib-ui = "camlib_ui.__main__:main"

[tool.setuptools.packages.find]
include = ["camlib_ui*"]

[tool.setuptools.package-data]
camlib_ui = ["web/**/*", "examples/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Ported code keeps its small local lambdas; shop files use the shop's star import, as its docs show.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"camlib_ui/examples/**/shop.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
